document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

details[open] svg[data-faq-icon] { transform: rotate(45deg); }\n@keyframes ac-pulse { 0% { box-shadow: 0 0 0 0 rgba(240,180,41,.55); } 70% { box-shadow: 0 0 0 14px rgba(240,180,41,0); } 100% { box-shadow: 0 0 0 0 rgba(240,180,41,0); } }\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  * { animation: none !important; transition: none !important; }\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background: #0A0A0A; color: #FFFFFF; overflow-x: clip;\">\n\n<header style=\"position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px clamp(20px, 4vw, 48px); background: rgba(10,10,10,.92); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255,255,255,.1);\">\n  <a href=\"#topo\" aria-label=\"Acesso Club, início\" style=\"display: flex; align-items: center;\"><img src=\"ab469e6e-cfda-45a8-bb4e-19973e7e9709\" alt=\"Acesso Club\" style=\"height: clamp(20px, 2.6vw, 28px); width: auto; display: block;\"><\u002Fa>\n  <a href=\"#candidatura\" style=\"background: #F0B429; color: #0A0A0A; font-family: 'Cabinet Grotesk', sans-serif; font-weight: 800; font-size: clamp(12px, 1.1vw, 14px); letter-spacing: .04em; text-transform: uppercase; padding: 12px 20px; white-space: nowrap; animation: ac-pulse 2.4s ease-out infinite; transition: transform .2s ease, background .2s ease;\" style-hover=\"background: #f6c95c; color: #0A0A0A; transform: translateY(-2px);\">Garantir minha cidade<\u002Fa>\n<\u002Fheader>\n\n<div style=\"background: #F0B429; color: #0A0A0A; border-bottom: 2px solid #0A0A0A; padding: 10px 0; overflow: hidden;\"><div style=\"display: flex; width: max-content; animation: ac-marquee 28s linear infinite;\"><span style=\"white-space: nowrap; font-family: 'Cabinet Grotesk', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(13px, 1.3vw, 17px); letter-spacing: .08em;\">{{ preVenda }}<\u002Fspan><span aria-hidden=\"true\" style=\"white-space: nowrap; font-family: 'Cabinet Grotesk', sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(13px, 1.3vw, 17px); letter-spacing: .08em;\">{{ preVenda }}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n\n<section id=\"topo\" data-screen-label=\"Hero\" style=\"position: relative; min-height: 86svh; display: flex; flex-direction: column; justify-content: center; padding: clamp(56px, 7vw, 96px) clamp(20px, 5vw, 64px) 80px; overflow: hidden;\">\n  <img src=\"303b3eb7-eed6-44f5-9550-5af66da507b7\" alt=\"\" aria-hidden=\"true\" style=\"position: absolute; right: -14%; top: 50%; transform: translateY(-50%); width: min(72vw, 900px); opacity: .1; pointer-events: none; user-select: none;\">\n  <div style=\"position: relative; max-width: 1280px; margin: 0 auto; width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: clamp(32px, 4vw, 72px); align-items: center;\">\n    <div>\n      <p data-reveal=\"\" style=\"margin: 0 0 24px; font-size: clamp(12px, 1.2vw, 14px); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #F0B429;\">Pré-venda de licenciamento · cidades limitadas<\u002Fp>\n      <h1 data-reveal=\"\" style=\"margin: 0 0 28px; font-family: 'Cabinet Grotesk', sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; line-height: .96; font-size: clamp(38px, 5.2vw, 76px); text-wrap: balance;\">Tenha a <span id=\"ac-rot-word\" style=\"color: #F0B429; display: inline-block; transition: opacity .35s ease, transform .35s ease;\">{{ rotWord }}<\u002Fspan> do Acesso Club na sua cidade<\u002Fh1>\n      <p data-reveal=\"\" style=\"margin: 0 0 12px; max-width: 560px; font-size: clamp(16px, 1.4vw, 20px); line-height: 1.5; color: rgba(255,255,255,.86);\">Transforme sua cidade em uma máquina de receita recorrente.<\u002Fp>\n      <p data-reveal=\"\" style=\"margin: 0 0 12px; max-width: 560px; font-size: clamp(15px, 1.3vw, 18px); line-height: 1.55; color: rgba(255,255,255,.75);\">Monetize assinaturas de R$ 9,90/mês por usuário e venda o Acesso Club para empresas como benefício corporativo para seus colaboradores.<\u002Fp>\n      <p data-reveal=\"\" style=\"margin: 0; font-size: clamp(14px, 1.2vw, 16px); color: rgba(255,255,255,.6);\">A plataforma de benefícios por assinatura feita para cidades do interior.<\u002Fp>\n    <\u002Fdiv>\n    <div data-reveal=\"\" aria-live=\"polite\" style=\"justify-self: center; width: min(100%, 480px);\">\n      <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background: #FFFFFF; color: #0A0A0A; padding: clamp(28px, 4vw, 44px) clamp(24px, 3vw, 36px); text-align: center;\">\n          <p style=\"margin: 0 0 10px; font-family: 'Cabinet Grotesk', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 24px; letter-spacing: -0.01em;\">Recebemos sua candidatura!<\u002Fp>\n          <p style=\"margin: 0 0 24px; font-size: 16px; line-height: 1.6; color: rgba(10,10,10,.7);\">Nosso consultor vai entrar em contato o quanto antes.<\u002Fp>\n          <a href=\"{{ waHref }}\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-block; background: #0A0A0A; color: #F0B429; font-family: 'Cabinet Grotesk', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-size: 15px; padding: 16px 24px;\" style-hover=\"background: #222222; color: #F0B429;\">Falar com nosso time no WhatsApp<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"background: #FFFFFF; color: #0A0A0A; padding: clamp(24px, 3vw, 36px); display: grid; grid-template-columns: 1fr 1fr; gap: 14px;\">\n          <p style=\"grid-column: 1 / -1; margin: 0 0 2px; font-family: 'Cabinet Grotesk', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 20px; letter-spacing: -0.01em;\">Garanta sua cidade<\u002Fp>\n          <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1;\">\n            <label for=\"ach-nome\" style=\"font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;\">Nome<\u002Flabel>\n            <input id=\"ach-nome\" name=\"nome\" type=\"text\" required=\"{{ true }}\" sc-camel-auto-complete=\"name\" placeholder=\"Seu nome completo\" style=\"width: 100%; min-width: 0; box-sizing: border-box; border: 1.5px solid #0A0A0A; border-radius: 0; padding: 12px 14px; font-size: 15px; background: #FFFFFF; color: #0A0A0A;\">\n          <\u002Fdiv>\n          <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 6px;\">\n            <label for=\"ach-tel\" style=\"font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;\">WhatsApp<\u002Flabel>\n            <input id=\"ach-tel\" name=\"telefone\" type=\"tel\" required=\"{{ true }}\" sc-camel-auto-complete=\"tel\" sc-camel-input-mode=\"numeric\" placeholder=\"(00) 00000-0000\" sc-camel-on-input=\"{{ onPhoneInput }}\" sc-camel-min-length=\"{{ 14 }}\" style=\"width: 100%; min-width: 0; box-sizing: border-box; border: 1.5px solid #0A0A0A; border-radius: 0; padding: 12px 14px; font-size: 15px; background: #FFFFFF; color: #0A0A0A;\">\n          <\u002Fdiv>\n          <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 6px;\">\n            <label for=\"ach-email\" style=\"font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;\">E-mail<\u002Flabel>\n            <input id=\"ach-email\" name=\"email\" type=\"email\" required=\"{{ true }}\" sc-camel-auto-complete=\"email\" placeholder=\"voce@email.com\" style=\"width: 100%; min-width: 0; box-sizing: border-box; border: 1.5px solid #0A0A0A; border-radius: 0; padding: 12px 14px; font-size: 15px; background: #FFFFFF; color: #0A0A0A;\">\n          <\u002Fdiv>\n          <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 6px;\">\n            <label for=\"ach-cidade\" style=\"font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;\">Cidade<\u002Flabel>\n            <input id=\"ach-cidade\" name=\"cidade\" type=\"text\" required=\"{{ true }}\" placeholder=\"Sua cidade\" style=\"width: 100%; min-width: 0; box-sizing: border-box; border: 1.5px solid #0A0A0A; border-radius: 0; padding: 12px 14px; font-size: 15px; background: #FFFFFF; color: #0A0A0A;\">\n          <\u002Fdiv>\n          <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 6px;\">\n            <label for=\"ach-uf\" style=\"font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;\">Estado<\u002Flabel>\n            <sc-raw-select id=\"ach-uf\" name=\"estado\" required=\"{{ true }}\" sc-camel-default-value=\"\" sc-camel-on-change=\"{{ markTouched }}\" style=\"width: 100%; min-width: 0; box-sizing: border-box; border: 1.5px solid #0A0A0A; border-radius: 0; padding: 12px 10px; font-size: 15px; background: #FFFFFF; color: #0A0A0A; appearance: auto;\">\n              <option value=\"\" disabled=\"{{ true }}\">UF<\u002Foption>\n              <sc-for list=\"{{ ufs }}\" as=\"uf\" hint-placeholder-count=\"5\"><option value=\"{{ uf }}\">{{ uf }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1;\">\n            <label for=\"ach-pop\" style=\"font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;\">População aproximada da cidade<\u002Flabel>\n            <sc-raw-select id=\"ach-pop\" name=\"populacao\" required=\"{{ true }}\" sc-camel-default-value=\"\" sc-camel-on-change=\"{{ markTouched }}\" style=\"width: 100%; min-width: 0; box-sizing: border-box; border: 1.5px solid #0A0A0A; border-radius: 0; padding: 12px 10px; font-size: 15px; background: #FFFFFF; color: #0A0A0A; appearance: auto;\">\n              <option value=\"\" disa -height: 1; font-size: clamp(30px, 4vw, 52px);\">Território exclusivo, sem concorrência interna<\u002Fh2>\n      <p data-reveal=\"\" style=\"margin: 0; max-width: 520px; font-size: clamp(16px, 1.4vw, 19px); line-height: 1.6; color: rgba(10,10,10,.72);\">Cada cidade possui apenas um licenciado Acesso Club. Expanda sua rede de empresas parceiras, empresas conveniadas e assinantes no ritmo da sua cidade. Quanto maior o ecossistema, maior o potencial de crescimento da sua operação.<\u002Fp>\n      <a data-reveal=\"\" href=\"#candidatura\" style=\"display: inline-block; margin-top: 32px; background: #F0B429; color: #0A0A0A; border: 2px solid #0A0A0A; font-family: 'Cabinet Grotesk', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-size: clamp(14px, 1.3vw, 17px); padding: 16px 28px; animation: ac-pulse 2.4s ease-out infinite; transition: transform .2s ease, background .2s ease;\" style-hover=\"background: #f6c95c; color: #0A0A0A; transform: translateY(-2px);\">Quero meu território exclusivo<\u002Fa>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"position: relative; display: flex; justify-content: center; padding-bottom: 20px;\">\n      <div id=\"br-map\" style=\"width: min(100%, 460px);\">\n        <img src=\"9f773fac-19c8-4fef-8c72-c52a2e5c2480\" alt=\"Mapa do Brasil\" loading=\"lazy\" style=\"width: min(100%, 340px); height: auto; display: block; margin: 0 auto;\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Por que o Acesso Club\" style=\"position: relative; background: #0A0A0A; color: #FFFFFF; padding: clamp(80px, 10vw, 140px) clamp(20px, 5vw, 64px); overflow: hidden;\">\n  <svg sc-camel-view-box=\"0 0 600 600\" aria-hidden=\"true\" style=\"position: absolute; left: -180px; bottom: -220px; width: 640px; opacity: .07; pointer-events: none;\">\n    <g fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"5\" stroke-linecap=\"round\">\n      <circle cx=\"300\" cy=\"300\" r=\"60\" st  7vw, 88px) clamp(20px, 5vw, 64px); text-align: center;\">\n  <img src=\"ab469e6e-cfda-45a8-bb4e-19973e7e9709\" alt=\"Acesso Club\" loading=\"lazy\" style=\"height: clamp(22px, 2.6vw, 30px); width: auto; margin-bottom: 24px;\">\n  <p style=\"margin: 0 0 8px; font-size: 15px; color: rgba(255,255,255,.7);\">Acesso Club · Clube de benefícios por assinatura<\u002Fp>\n  <p style=\"margin: 0; font-size: 13px; color: rgba(255,255,255,.4);\">© 2026 Acesso Club. Todos os direitos reservados.<\u002Fp>\n<\u002Ffooter>\n\n<sc-if value=\"{{ showSticky }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(10,10,10,.94); border-top: 1px solid rgba(255,255,255,.15);\">\n    <a href=\"#candidatura\" style=\"display: block; text-align: center; background: #F0B429; color: #0A0A0A; font-family: 'Cabinet Grotesk', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-size: 15px; padding: 16px; animation: ac-pulse 2.4s ease-out infinite;\">Garantir minha cidade<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;whatsappNumber&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;5563991203763&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contato&quot;}, &quot;webhookUrl&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Integração&quot;}, &quot;metaPixelId&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Tracking&quot;}, &quot;googleAdsId&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Tracking&quot;}, &quot;googleAdsLabel&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Tracking&quot;}}\">\nclass Component extends DCLogic {\n  state = { submitted: false, sending: false, showSticky: false, rotIdx: 0 };\n  rotWords = ['exclusividade', 'operação', 'marca', 'tecnologia', 'receita'];\n\n  componentDidMount() {\n    ['ac-uf', 'ac-pop', 'ach-uf', 'ach-pop'].forEach((id) => {\n      const s = document.getElementById(id);\n      if (s && !s.dataset.touched) s.value = '';\n    });\n    this.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    if (!this.reduced && 'IntersectionObserver' in window) {\n      els.forEach((el) => {\n        el.style.opacity = '0';\n        el.style.transform = 'translateY(22px)';\n        el.style.transition = 'opacity .7s ease, transform .7s ease';\n      });\n      this._io = new IntersectionObserver((entries) => {\n        entries.forEach((e) => {\n          if (e.isIntersecting) {\n            e.target.style.opacity = '1';\n            e.target.style.transform = 'none';\n            this._io.unobserve(e.target);\n          }\n        });\n      }, { threshold: 0.12 });\n      els.forEach((el) => this._io.observe(el));\n      const anchor = document.querySelector('[data-price-anchor]');\n      const priceEl = document.querySelector('[data-price]');\n      if (anchor && priceEl) {\n        this._ioPrice = new IntersectionObserver((entries) => {\n          if (entries[0].isIntersecting) {\n            this._ioPrice.disconnect();\n            this.animatePrice(priceEl);\n          }\n        }, { threshold: 0.5 });\n        this._ioPrice.observe(anchor);\n      }\n    }\n    if (!this.reduced) {\n      this._rotTimer = setInterval(() => {\n        const el = document.getElementById('ac-rot-word');\n        if (!el) return;\n        el.style.opacity = '0';\n        el.style.transform = 'translateY(12px)';\n        setTimeout(() => {\n          this.setState((s) => ({ rotIdx: (s.rotIdx + 1) % this.rotWords.length }));\n          requestAnimationFrame(() => requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'none'; }));\n        }, 360);\n      }, 3200);\n    }\n    this.initMap();\n    this.initTracking();\n    this._onScroll = () => {\n      const max = document.documentElement.scrollHeight - window.innerHeight;\n      const past = max > 0 && window.scrollY / max > 0.5;\n      const mobile = window.innerWidth < 760;\n      const nearForm = (() => {\n        const f = document.getElementById('candidatura');\n        if (!f) return false;\n        const r = f.getBoundingClientRect();\n        return r.top < window.innerHeight && r.bottom > 0;\n      })();\n      const show = mobile && past && !nearForm;\n      if (show !== this.state.showSticky) this.setState({ showSticky: show });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    window.addEventListener('resize', this._onScroll);\n  }\n\n  initMap() {\n    const host = document.getElementById('br-map');\n    if (!host || !('IntersectionObserver' in window)) return;\n    this._ioMap = new IntersectionObserver((es) => {\n      if (es[0].isIntersecting) { this._ioMap.disconnect(); this.drawMap(host); }\n    }, { rootMargin: '200px' });\n    this._ioMap.observe(host);\n  }\n\n  async drawMap(host) {\n    if (this._mapDone) return;\n    this._mapDone = true;\n    try {\n      if (!window.BR_STATES_PATHS) {\n        await new Promise((resolve, reject) => {\n          const s = document.createElement('script');\n          s.src = 'assets/br-states.js';\n          s.onload = resolve; s.onerror = reject;\n          document.head.appendChild(s);\n        });\n      }\n      const NS = 'http://www.w3.org/2000/svg';\n      const svg = document.createElementNS(NS, 'svg');\n      svg.setAttribute('viewBox', '0
